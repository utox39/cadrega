<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; connect-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Cadrega</title>
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <main>
    <h1>Cadrega</h1>
    <p class="subtitle">Malicious Skills Detector — drop a skill file, pick a provider, analyze.</p>

    <form id="analyze-form">
      <div class="panel">
        <div id="dropzone" class="dropzone">
          <div>Drag &amp; drop a skill file here, or click to pick one</div>
          <div class="hint">Markdown files only (for now...)</div>
          <div id="filename" class="filename"></div>
        </div>
        <input type="file" id="file-input">
      </div>

      <div class="panel">
        <div class="row">
          <div class="field">
            <label for="provider">LLM provider</label>
            <select id="provider" name="provider">
              <option value="ollama" selected>ollama</option>
              <option value="anthropic">anthropic</option>
              <option value="openai">openai</option>
            </select>
          </div>
          <div class="field">
            <label for="model_name">Model name</label>
            <input type="text" id="model_name" name="model_name" placeholder="e.g. llama3.1" required>
          </div>
        </div>

        <fieldset id="ollama-fields">
          <legend>Ollama options</legend>
          <div class="row">
            <div class="field">
              <label for="ollama_address">Address</label>
              <input type="text" id="ollama_address" value="localhost">
            </div>
            <div class="field">
              <label for="ollama_port">Port</label>
              <input type="number" id="ollama_port" value="11434">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="ollama_num_ctx">Context window (tokens)</label>
              <input type="number" id="ollama_num_ctx" value="8192">
            </div>
            <div>
              <div class="checkbox-row">
                <input type="checkbox" id="ollama_think">
                <label for="ollama_think">Thinking</label>
              </div>
              <div class="checkbox-row">
                <input type="checkbox" id="ollama_unload_model">
                <label for="ollama_unload_model">Unload model after analysis</label>
              </div>
            </div>
          </div>
        </fieldset>

        <button type="submit" id="submit-btn" disabled>Analyze</button>
        <div id="status" class="status"></div>
      </div>
    </form>

    <div id="results"></div>
  </main>

  <script src="app.js"></script>
</body>

</html>
